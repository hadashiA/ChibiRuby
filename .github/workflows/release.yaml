name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag: git tag you want create. (sample 1.0.0)"
        required: true
      dry-run:
        description: "dry-run: false = create release/nuget. true = never create release/nuget."
        required: true
        default: false
        type: boolean

env:
  GIT_TAG: ${{ github.event.inputs.tag }}

jobs:
  update-version-number:
    uses: ./.github/workflows/update-version-number.yaml
    permissions:
      contents: write
    with:
      tag: ${{ github.event.inputs.tag }}
      dry-run: ${{ fromJson(github.event.inputs.dry-run) }}
   
  build-dotnet:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    needs: [update-version-number]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ needs.update-version-number.outputs.sha }}
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
    - run: dotnet build -c Release
    - run: dotnet test -c Release --no-build
      env:
        TZ: Asia/Tokyo
        
    - run: dotnet pack -c Release --no-build -o ./publish
      
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: ./publish

        
    - name: Login to NuGet
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USERNAME}}

    - name: Push to NuGet
      run: |
        dotnet nuget push ./publish/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      
  build-vscode-extension:
    needs: [update-version-number]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ needs.update-version-number.outputs.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Package VSIX
      run: npx --yes @vscode/vsce package
      working-directory: editor-extensions/vscode
    - uses: actions/upload-artifact@v4
      with:
        name: vscode-extension
        path: editor-extensions/vscode/*.vsix

    # Requires repo secret VSCE_PAT — Azure DevOps Personal Access Token with
    # Marketplace → Manage scope, owned by the same publisher as package.json.
    - name: Publish to Visual Studio Marketplace
      if: github.event.inputs.dry-run == 'false'
      run: npx --yes @vscode/vsce publish --packagePath *.vsix --pat "$VSCE_PAT"
      working-directory: editor-extensions/vscode
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

  build-zed-extension:
    needs: [update-version-number]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ needs.update-version-number.outputs.sha }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-wasip2
    - name: Build Zed extension (WASM)
      run: cargo build --release --target wasm32-wasip2
      working-directory: editor-extensions/zed
    # Zed extension distribution is via PR to zed-industries/extensions, not
    # an API push. This job only verifies the WASM blob builds cleanly so a
    # broken extension never ships with the release.

  create-release:
    if: github.event.inputs.dry-run == 'false'
    needs: [update-version-number, build-dotnet, build-vscode-extension, build-zed-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vscode-extension
        path: ./release-assets
    - uses: softprops/action-gh-release@v1
      id: create_release
      with:
        tag_name: ${{ env.GIT_TAG }}
        name: v${{ env.GIT_TAG }}
        draft: true
        prerelease: false
        generate_release_notes: true
        files: ./release-assets/*.vsix
