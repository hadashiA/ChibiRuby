name: Build mruby-compiler (WebAssembly)

on:
  workflow_call:
  workflow_dispatch:

env:
  MRUBY_DIR: ${{ github.workspace }}/src/ChibiRuby.Compiler/mruby
  CONFIG_DIR: ${{ github.workspace }}/src/ChibiRuby.Compiler

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-url: ${{ steps.upload-build.artifact-url }}
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.74

    - name: Build mruby-compiler (WebAssembly)
      working-directory: ${{ env.MRUBY_DIR }}
      run: |
        MRUBY_CONFIG=${{ env.CONFIG_DIR }}/build_config.wasm.rb rake

    - uses: actions/upload-artifact@v4
      id: upload-build
      with:
        name: wasm-build
        path: ${{ env.MRUBY_DIR }}/build
