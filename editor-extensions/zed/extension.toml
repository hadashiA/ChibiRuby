id = "chibiruby"
name = "ChibiRuby Debug Adapter"
version = "0.1.0"
schema_version = 1
authors = ["hadashiA"]
description = "DAP bridge for ChibiRuby — attach to MRubyDapServer running inside a Unity host (or any .NET host) over TCP."
repository = "https://github.com/hadashiA/ChibiRuby"

# Registers the "chibiruby" adapter name so .zed/debug.json's `"adapter": "chibiruby"`
# resolves here. The actual TCP host/port comes from the user's `tcp_connection`
# field (defaulted to 127.0.0.1:4711 in src/chibi_ruby.rs).
[debug_adapters.chibiruby]
